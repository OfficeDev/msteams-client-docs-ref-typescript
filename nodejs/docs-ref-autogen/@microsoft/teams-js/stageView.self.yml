### YamlMime:TSPackage
uid: '@microsoft/teams-js.stageView.self'
name: self
type: module
package: '@microsoft/teams-js'
summary: Module for actions that can be taken by the stage view itself.
previewState: beta
functions:
  - name: close(string)
    uid: '@microsoft/teams-js.stageView.self.close'
    package: '@microsoft/teams-js'
    summary: >-
      Closes the current stage view. This function will be a no-op if called
      from outside of a stage view.
    remarks: ''
    previewState: beta
    isDeprecated: false
    syntax:
      content: 'function close(result?: string): Promise<void>'
      parameters:
        - id: result
          type: string
          description: >-
            Optional opaque serialized result passed to the host when closing.

            An empty string is a result. Requires the host to advertise
            `stageView.self.closeResult` support;

            otherwise the request is rejected without closing. The SDK does not
            interpret the result.
      return:
        description: >-
          Promise that resolves or rejects with an error once the stage view is
          closed.

          The promise acknowledges closing; it does not return the result to the
          closing application.

          This does not add a result callback to `stageView.open()`.
        type: Promise&lt;void&gt;
  - name: isCloseResultSupported()
    uid: '@microsoft/teams-js.stageView.self.isCloseResultSupported'
    package: '@microsoft/teams-js'
    summary: >-
      Checks whether the host supports passing a result when closing a stage
      view.
    remarks: ''
    previewState: beta
    isDeprecated: false
    syntax:
      content: 'function isCloseResultSupported(): boolean'
      return:
        description: true if the host supports Stage close results; otherwise false.
        type: boolean
  - name: isSupported()
    uid: '@microsoft/teams-js.stageView.self.isSupported'
    package: '@microsoft/teams-js'
    summary: Checks if stageView.self capability is supported by the host
    remarks: ''
    previewState: beta
    isDeprecated: false
    syntax:
      content: 'function isSupported(): boolean'
      return:
        description: >-
          boolean to represent whether the stageView.self capability is
          supported
        type: boolean
