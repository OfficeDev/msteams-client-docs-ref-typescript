### YamlMime:TSPackage
uid: '@microsoft/teams-js.clipboard'
name: clipboard
type: module
package: '@microsoft/teams-js'
summary: Interact with the system clipboard.
previewState: beta
functions:
  - name: hasPermission()
    uid: '@microsoft/teams-js.clipboard.hasPermission'
    package: '@microsoft/teams-js'
    summary: Checks whether the app has permission to read from the system clipboard.
    remarks: ''
    previewState: beta
    isDeprecated: false
    syntax:
      content: 'function hasPermission(): Promise<boolean>'
      return:
        description: >-
          A promise that resolves to `true` if clipboard-read permission has
          been granted,

          or `false` if permission has not been granted.
        type: Promise&lt;boolean&gt;
  - name: isSupported()
    uid: '@microsoft/teams-js.clipboard.isSupported'
    package: '@microsoft/teams-js'
    summary: Checks if clipboard capability is supported by the host
    remarks: ''
    previewState: beta
    isDeprecated: true
    customDeprecatedMessage: >-
      As of TeamsJS v2.54.0, the clipboard capability is deprecated. These APIs
      may stop working at

      any time without notice: support for this capability in Teams and other
      host apps may be removed

      entirely and independently of a TeamsJS major release, so continued
      functionality is not

      guaranteed. The intended long-term replacement is the standardized
      Clipboard API provided by the

      browser ([Clipboard
      API](https://developer.mozilla.org/docs/Web/API/Clipboard_API),
      `navigator.clipboard`).

      For browser-native reads, use
      [hasPermission](xref:@microsoft/teams-js.clipboard.hasPermission) and
      [requestPermission](xref:@microsoft/teams-js.clipboard.requestPermission)
      before calling

      `navigator.clipboard.read()` from a user gesture.
    syntax:
      content: 'function isSupported(): boolean'
      return:
        description: boolean to represent whether the clipboard capability is supported
        type: boolean
  - name: read()
    uid: '@microsoft/teams-js.clipboard.read'
    package: '@microsoft/teams-js'
    summary: Function to read data from clipboard.
    remarks: ''
    isDeprecated: true
    customDeprecatedMessage: >-
      As of TeamsJS v2.54.0, the clipboard capability is deprecated. These APIs
      may stop working at

      any time without notice: support for this capability in Teams and other
      host apps may be removed

      entirely and independently of a TeamsJS major release, so continued
      functionality is not

      guaranteed. The intended long-term replacement is the standardized
      Clipboard API provided by the

      browser ([Clipboard
      API](https://developer.mozilla.org/docs/Web/API/Clipboard_API),
      `navigator.clipboard`).

      For browser-native reads, use
      [hasPermission](xref:@microsoft/teams-js.clipboard.hasPermission) and
      [requestPermission](xref:@microsoft/teams-js.clipboard.requestPermission)
      before calling

      `navigator.clipboard.read()` from a user gesture.
    syntax:
      content: 'function read(): Promise<Blob>'
      return:
        description: |-
          A promise blob which resolves to the data read from the clipboard or
                   rejects stating the reason for failure.
                   Note: Returned blob type will contain one of the MIME type `image/png`, `text/plain` or `text/html`.
        type: Promise&lt;Blob&gt;
  - name: requestPermission()
    uid: '@microsoft/teams-js.clipboard.requestPermission'
    package: '@microsoft/teams-js'
    summary: Requests permission to read from the system clipboard.
    remarks: >-
      The host may need to reload the app frame after the permission is first
      granted before

      `navigator.clipboard.read()` is available to the existing frame.
    previewState: beta
    isDeprecated: false
    syntax:
      content: 'function requestPermission(): Promise<boolean>'
      return:
        description: >-
          A promise that resolves to `true` if clipboard-read permission was
          granted,

          or `false` if permission was not granted.
        type: Promise&lt;boolean&gt;
  - name: write(Blob)
    uid: '@microsoft/teams-js.clipboard.write'
    package: '@microsoft/teams-js'
    summary: Function to copy data to clipboard.
    remarks: |-
      Note: clipboard.write only supports Text, HTML, PNG, and JPEG data format.
            MIME type for Text -> `text/plain`, HTML -> `text/html`, PNG/JPEG -> `image/(png | jpeg)`
            Also, JPEG will be converted to PNG image when copying to clipboard.
    isDeprecated: true
    customDeprecatedMessage: >-
      As of TeamsJS v2.54.0, the clipboard capability is deprecated. These APIs
      may stop working at

      any time without notice: support for this capability in Teams and other
      host apps may be removed

      entirely and independently of a TeamsJS major release, so continued
      functionality is not

      guaranteed. The intended long-term replacement is the standardized
      Clipboard API provided by the

      browser ([Clipboard
      API](https://developer.mozilla.org/docs/Web/API/Clipboard_API),
      `navigator.clipboard`).

      For browser-native reads, use
      [hasPermission](xref:@microsoft/teams-js.clipboard.hasPermission) and
      [requestPermission](xref:@microsoft/teams-js.clipboard.requestPermission)
      before calling

      `navigator.clipboard.read()` from a user gesture.
    syntax:
      content: 'function write(blob: Blob): Promise<void>'
      parameters:
        - id: blob
          type: Blob
          description: A Blob object representing the data to be copied to clipboard.
      return:
        description: >-
          A string promise which resolves to success message from the clipboard
          or
                   rejects with error stating the reason for failure.
        type: Promise&lt;void&gt;
